services:
  # ===========================
  # PostgreSQL (the database)
  # ===========================
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.10}
    container_name: layered-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    command: ["postgres", "-c", "password_encryption=md5"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-myapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # v2 limits: enforced on single-host Compose
    mem_limit: "1g"
    cpus: "1.0"
    networks:
      - app-network

  # ===========================
  # PgBouncer (connection pooler)
  # ===========================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: layered-pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"         # host 6432 -> container 6432
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-myuser}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - DB_NAME=${POSTGRES_DB:-myapp}
      - POOL_MODE=${PGBOUNCER_POOL_MODE:-transaction}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-100}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      - LISTEN_ADDR=0.0.0.0
      - LISTEN_PORT=6432
      - AUTH_TYPE=trust                 # switch to md5 + userlist.txt when you harden
      # - AUTH_TYPE=md5
      # - AUTH_FILE=/etc/pgbouncer/userlist.txt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-myuser} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: "256m"
    cpus: "0.2"
    networks:
      - app-network

  # ===========================
  # App (Node.js)
  # ===========================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.simple
    container_name: layered-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=${POSTGRES_DB:-myapp}
      - DB_USER=${POSTGRES_USER:-myuser}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - PORT=${PORT:-3000}
      - HEALTH_PATH=${HEALTH_PATH:-/health}
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}${HEALTH_PATH:-/health}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: "512m"
    cpus: "0.5"
    networks:
      - app-network

# ===========================
# Volumes & Networks
# ===========================
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge