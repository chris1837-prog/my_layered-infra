[databases]
myapp = host=postgres port=5432 dbname=myapp user=myuser password=mypassword

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Tuning according to task
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
max_client_conn = 100
query_timeout = 30
server_idle_timeout = 60

# Reduce log noise
log_connections = 0
log_disconnections = 0
# optional: reduce periodic stats lines
stats_period = 0

# (nice to have for node-postgres)
ignore_startup_parameters = extra_float_digits

# allow admin / stats console access
admin_users = myuser
stats_users = myuser