[databases]
# Application database mapping
myapp = host=postgres port=5432 dbname=myapp user=myuser password=mypassword

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Tuning according to task
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
max_client_conn = 100
query_timeout = 30
server_idle_timeout = 60
