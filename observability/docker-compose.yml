services:
  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [obs]

  loki:
    image: grafana/loki:2.9.4
    # Nutze die eingebaute Default-Config:
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks: [obs]

  grafana:
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    environment:
      # Behalte dein Admin/PW wie gehabt
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on: [loki]
    volumes:
      - grafana-data:/var/lib/grafana   # Persistenz für Login/Dashboards
    networks: [obs]

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/app:ro          # wir “tailen” diese lokalen Logfiles
    depends_on: [loki]
    networks: [obs]

networks:
  obs:

volumes:
  loki-data:
  grafana-data:
