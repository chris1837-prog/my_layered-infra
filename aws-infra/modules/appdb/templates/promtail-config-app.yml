server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://10.0.1.10:3100/loki/api/v1/push

scrape_configs:
  - job_name: host_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__:
            - /var/log/syslog

  - job_name: appdb_container
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '.*app.*'
        action: keep
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - docker: {}
