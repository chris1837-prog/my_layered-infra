# cloud-init/edge-wg.yaml
# Edge node: WireGuard + NAT + Firewall + Caddy

packages:
  - wireguard
  - wireguard-tools
  - ufw
  - curl
  - vim
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

# WireGuard server configuration
write_files:
  - path: /etc/wireguard/wg0.conf
    permissions: '600'
    owner: root:root
    content: |
      [Interface]
      Address = 10.200.0.1/24
      ListenPort = 51820
      PrivateKey = <SERVER_PRIVATE_KEY>
      SaveConfig = true

  - path: /usr/local/bin/wg-admin.sh
    permissions: '755'
    owner: root:root
    content: |
      #!/bin/bash
      WG_CONF=/etc/wireguard/wg0.conf

      add_peer() {
        local PUBKEY=$1
        local ALLOWED=$2
        echo -e "\n[Peer]\nPublicKey = $PUBKEY\nAllowedIPs = $ALLOWED" | sudo tee -a $WG_CONF
        sudo wg syncconf wg0 <(wg-quick strip wg0)
        echo "Peer added: $PUBKEY -> $ALLOWED"
      }

      remove_peer() {
        local PUBKEY=$1
        sudo wg set wg0 peer $PUBKEY remove
        sudo wg syncconf wg0 <(wg-quick strip wg0)
        echo "Peer removed: $PUBKEY"
      }

      show_peers() {
        sudo wg show
      }

      case $1 in
        add) add_peer $2 $3 ;;
        remove) remove_peer $2 ;;
        list) show_peers ;;
        *) echo "Usage: $0 {add|remove|list} <pubkey> [allowed_ips]" ;;
      esac

# Firewall configuration
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp   # SSH
  - ufw allow 51820/udp # WireGuard
  - ufw allow 80
  - ufw allow 443
  - ufw enable
  - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
  - netfilter-persistent save

# Caddy installation
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt update
  - apt install -y caddy
  - systemctl enable caddy
  - systemctl start caddy

# Enable WireGuard on boot
  - systemctl enable wg-quick@wg0
  - systemctl start wg-quick@wg0

