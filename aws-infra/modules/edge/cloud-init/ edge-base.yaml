#cloud-config
package_update: true
package_upgrade: all
packages:
  - ufw
runcmd:
  #  Deny inbound, allow outbound
  - ufw default deny incoming
  - ufw default allow outgoing
  # Allow HTTP/S for Caddy
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  # Restrict SSH and WireGuard to admin CIDRs
  - ufw allow from 203.0.113.0/24 to any port 22 proto tcp
  - ufw allow from 203.0.113.0/24 to any port 51820 proto udp
  - ufw --force enable
