#cloud-config
write_files:
  - path: /etc/iptables/rules.v4
    content: |
      *filter
      :INPUT ACCEPT [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      -A FORWARD -i wg0 -j ACCEPT
      -A FORWARD -o wg0 -j ACCEPT
      -A FORWARD -i ${private_interface} -j ACCEPT
      -A FORWARD -o ${private_interface} -j ACCEPT
      -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      
      COMMIT
      
      *nat
      :PREROUTING ACCEPT [0:0]
      :INPUT ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      :POSTROUTING ACCEPT [0:0]
      
      -A POSTROUTING -s ${wireguard_network} -o ${public_interface} -j MASQUERADE
      -A POSTROUTING -s 10.0.0.0/8 -o ${public_interface} -j MASQUERADE
      -A POSTROUTING -s 172.16.0.0/12 -o ${public_interface} -j MASQUERADE
      -A POSTROUTING -s 192.168.0.0/16 -o ${public_interface} -j MASQUERADE
      
      COMMIT
    permissions: '0644'
    owner: root:root

packages:
  - ufw
  - iptables-persistent
  - netfilter-persistent

runcmd:
  # Enable IPv4 forwarding immediately
  - sysctl -w net.ipv4.ip_forward=1

  # Persist IPv4 forwarding across reboots
  - sed -i 's/^#net.ipv4.ip_forward=1/net.ipv4.ip_forward=1/' /etc/sysctl.conf

  # Add MASQUERADE rule
  - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

  # Save rules for persistence
  - sh -c "iptables-save > /etc/iptables/rules.v4"