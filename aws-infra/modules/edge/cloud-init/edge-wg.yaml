# cloud-init/edge-wg.yaml
#cloud-config
write_files:
  - path: /etc/wireguard/wg0.conf
    owner: root:root
    permissions: '600'
    content: |
      [Interface]
      Address = 10.200.0.1/24
      ListenPort = 51820
      PrivateKey = REPLACE_WITH_EDGE_PRIVATE_KEY
      PostUp = iptables -t nat -A POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE
      PostDown = iptables -t nat -D POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE

runcmd:
  - wg-quick up wg0
  - systemctl enable wg-quick@wg0
