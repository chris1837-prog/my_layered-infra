# cloud-init/edge-wg-admin.yaml
#cloud-config
write_files:
  - path: /etc/wireguard/peers/admin1.conf
    owner: root:root
    permissions: '600'
    content: |
      [Peer]
      PublicKey = REPLACE_WITH_ADMIN_PUBLIC_KEY
      AllowedIPs = 10.200.0.10/32

runcmd:
  - wg addconf wg0 /etc/wireguard/peers/admin1.conf || true
  - wg show
