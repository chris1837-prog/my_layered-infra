name: Terraform Policy Check (Disabled Until Blockers Cleared)

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  tf-policy:
    if: false  # Workflow temporarily disabled until blockers (G2, B6) are cleared
    name: Validate Terraform Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.48.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Initialize Terraform
        working-directory: aws-infra/environments/dev
        run: terraform init -input=false

      - name: Create Terraform Plan
        working-directory: aws-infra/environments/dev
        run: |
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Run Policy Check with Conftest
        run: conftest test aws-infra/environments/dev/tfplan.json -p aws-infra/policies/

      - name: Done
        run: echo "All policy checks completed successfully."

