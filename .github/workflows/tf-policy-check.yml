name: Terraform Policy Check

on:
  pull_request:
    branches: [ "**" ]

jobs:
  tf-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz \
            | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Run Terraform policy test
        run: make test-tf-policy