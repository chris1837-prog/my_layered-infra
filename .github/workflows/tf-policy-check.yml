name: Terraform Policy Check (Disabled Until Blockers Cleared)

on:
  pull_request:
    branches:
      - main
      - development
      - '*'

jobs:
  tf-policy:
    if: false  # Workflow temporarily disabled until blockers (G2, B6) are cleared
    name: Validate Terraform Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.48.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/


      - name: Run Terraform Policy Check 
        run: make test-tf-policy ENV=dev
