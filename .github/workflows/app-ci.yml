name: Security Related Tasks

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - "**"

jobs:
  audit:
    name: Run NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run NPM Audit
        working-directory: ./mvp-compose/app
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "Warning: package-lock.json not found in $APP_DIR — skipping audit"
            exit 1
          fi

