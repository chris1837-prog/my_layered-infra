name: Compose Smoke Test
on:
  pull_request:
    branches: [ development ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        # Run the command from the root but specify the compose file location
        run: docker compose -f mvp-compose/docker-compose.yml up -d --build

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            # Use the healthcheck from the compose file's app service
            docker inspect --format='{{.State.Health.Status}}' layered-app | grep 'healthy' && break
            echo -n "."
            sleep 5
          done
          echo "App is healthy!"

      - name: Run Jest unit and integration tests
        run: docker compose -f mvp-compose/docker-compose.yml exec -T app npm test

      - name: Stop services
        if: always() # This step runs even if the tests fail
        run: docker compose -f mvp-compose/docker-compose.yml down