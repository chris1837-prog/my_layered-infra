name: Compose Smoke Test
on:
  pull_request:
    branches: [ development ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI override for Docker Compose
        run: |
          echo "services:" > mvp-compose/docker-compose.ci.yml
          echo "  app:" >> mvp-compose/docker-compose.ci.yml
          echo "    build:" >> mvp-compose/docker-compose.ci.yml
          echo "      context: ./app" >> mvp-compose/docker-compose.ci.yml
          echo "      dockerfile: Dockerfile.test" >> mvp-compose/docker-compose.ci.yml

      - name: Start services with Docker Compose
        run: docker compose -f mvp-compose/docker-compose.yml -f mvp-compose/docker-compose.ci.yml up -d --build

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            docker inspect --format='{{.State.Health.Status}}' layered-app | grep 'healthy' && break
            echo -n "."
            sleep 5
          done
          echo "App is healthy!"

      - name: Run Jest unit and integration tests
        run: docker compose -f mvp-compose/docker-compose.yml exec -T app npm test

      - name: Stop services
        if: always()
        run: docker compose -f mvp-compose/docker-compose.yml down