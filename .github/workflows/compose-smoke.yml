name: Compose Smoke Test
on:
  pull_request:
    # Updated to target the correct main branch
    branches: [ development ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16 # Using a more general tag
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        options: >-
          --health-cmd="pg_isready -U myuser -d myapp"
          --health-interval=10s --health-timeout=5s --health-retries=5
        ports:
          - 5432:5432
      pgbouncer:
        image: edoburu/pgbouncer:1.22 # Using a more general tag
        env:
          DB_HOST: postgres
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DB_NAME: myapp
          POOL_MODE: transaction
          LISTEN_PORT: 6432
          AUTH_TYPE: md5
        ports:
          - 6432:6432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the application Docker image
        run: docker build -t layered-app ./mvp-compose/app

      - name: Run the application container
        run: |
          docker run \
            -d \
            --name layered-app \
            --network host \
            -e PORT=3000 \
            -e DB_HOST=localhost \
            -e DB_PORT=6432 \
            -e DB_USER=myuser \
            -e DB_PASSWORD=mypassword \
            -e DB_NAME=myapp \
            layered-app

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            curl -f http://localhost:3000/health && break
            echo -n "."
            sleep 2
          done
          echo "App is healthy!"

      - name: Run Jest unit and integration tests
        run: docker exec layered-app npm test