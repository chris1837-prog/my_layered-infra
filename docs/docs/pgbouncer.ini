[Unit]
Description=PgBouncer (headless mTLS for proxy host)
After=network-online.target

[Service]
User=pgbouncer
Group=pgbouncer
WorkingDirectory=/etc/pgbouncer
ExecStart=/usr/bin/pgbouncer -u pgbouncer /etc/pgbouncer/headless.ini
Restart=on-failure
NoNewPrivileges=yes
LimitNOFILE=8192

[Install]
WantedBy=multi-user.target
